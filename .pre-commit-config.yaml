exclude: 'node_modules|.git|etransactions/schematron/.*\.(xslt?|xml)$|etransactions/tests/invoices/|etransactions/components/ext/|etransactions/public/dist/'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "etransactions.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg|.*po$"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                etransactions/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                etransactions/templates/includes/.*|
                etransactions/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                etransactions/public/dist/.*|
                cypress/.*|
                frontend/.*|
                .*node_modules.*|
                .*boilerplate.*|
                etransactions/templates/includes/.*|
                etransactions/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
