components:
  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    TokenRequestDto:
      required:
        - password
        - username
      type: object
      properties:
        username:
          type: string
          description: Nom d'utilisateur
          example: john.doe
        password:
          type: string
          description: Mot de passe
          example: secret123
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
        id_token:
          type: string
        not-before-policy:
          type: integer
          format: int32
        session_state:
          type: string
        scope:
          type: string
        error:
          type: string
        error_description:
          type: string
        error_uri:
          type: string
    AddressRead:
      type: object
      properties:
        addressLine1:
          maxLength: 255
          type: string
          description: Correspond à l’address de la structure destinataire ayant définie
            la ou les lignes d’annuaire.
          example: 16 BIS RUE HENRI BARBUSSE
        addressLine2:
          maxLength: 255
          type: string
          description: Correspond à l’address de la structure destinataire ayant définie
            la ou les lignes d’annuaire.
          example: CEDEX 1
        addressLine3:
          maxLength: 255
          type: string
          description: Correspond à l’address de la structure destinataire ayant définie
            la ou les lignes d’annuaire.
          example: Bâtiment le Callipso
        postalCode:
          maxLength: 5
          pattern: "[0-9]*"
          type: string
          description: Service postal code
          example: "38100"
        countrySubdivision:
          maxLength: 255
          type: string
          description: Subdivision of the country
          example: Bretagne
        locality:
          maxLength: 100
          type: string
          description: Municipality of the recipient structure having defined the
            directory line(s).
          example: Grenoble
        countryCode:
          maxLength: 2
          type: string
          description: Correspond au code pays de la structure destinataire.
          example: FR
        countryName:
          maxLength: 100
          type: string
          description: Correspond au pays de la structure destinataire ayant définie la ou
            les lignes d’annuaire
          example: France
    FacilityPayloadHistoryUle:
      type: object
      properties:
        siret:
          maxLength: 14
          minLength: 0
          pattern: ^([0-9]{14})$
          type: string
          description: SIRET number
          example: "70204275500240"
        siren:
          maxLength: 9
          minLength: 0
          pattern: ^([0-9]{9})$
          type: string
          description: SIREN number
          example: "702042755"
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: Business name
          example: Boulangerie Pascale
        facilityType:
          maxLength: 20
          minLength: 0
          type: string
          description: Indicates whether the facility is listed as the main facility or
            not (P - Main facility / S - Secondary facility)
          example: P
          enum:
            - P
            - S
        administrativeStatus:
          maxLength: 1
          minLength: 0
          type: string
          description: Facility administrative status (A - Active / F - Closed)
          example: A
          enum:
            - A
            - F
        instructions:
          $ref: "#/components/schemas/Instructions"
        address:
          $ref: "#/components/schemas/AddressRead"
        b2gAdditionalData:
          $ref: "#/components/schemas/FacilityPayloadHistoryUle_b2gAdditionalData"
        legalUnit:
          $ref: "#/components/schemas/LegalUnitPayloadIncluded"
    FacilityPayloadHistoryUle_b2gAdditionalData:
      type: object
      properties:
        pm:
          type: boolean
          description: Indicates whether the public structure acts as project manager for
            work invoices in addition to receiving simple invoices. This
            attribute is only returned if the directory line is defined for a
            public structure at the SIREN / SIRET or SIREN / SIRET / Routing
            code level.
          example: true
        pmOnly:
          type: boolean
          description: Indicates whether the public structure only acts as a project
            manager; if so, it can only receive invoices for work. This
            attribute is only returned if the directory line is defined for a
            public structure at the SIREN/SIRET or SIREN/SIRET/Routing code
            level.
          example: true
        managesPaymentStatus:
          type: boolean
          description: Indicates whether the public structure manages the payment status
            of invoices. This attribute is only returned if the directory line
            is defined for a public structure at the SIREN / SIRET or SIREN /
            SIRET / Routing code level.
          example: true
        managesLegalCommitmentCode:
          type: boolean
          description: Indicates whether the public structure requires a legal commitment
            number. This attribute is only returned if the directory line is
            defined for a public structure at the SIREN / SIRET or SIREN / SIRET
            / Routing code level.
          example: true
        managesLegalCommitmentOrServiceCode:
          type: boolean
          description: Indicates whether the public structure requires a service code or a
            commitment code in its exchanges. This attribute is only returned if
            the directory line is defined for a public structure at the SIREN /
            SIRET or SIREN / SIRET / Routing code level.
          example: true
        serviceCodeStatus:
          type: boolean
          description: Indicates whether the structure requires a service code. This
            attribute is only returned if the directory line is defined for a
            public structure at the SIREN / SIRET or SIREN / SIRET / Routing
            code level.
          example: true
    Instructions:
      type: object
      properties:
        isSalesProspectingForbidden:
          type: boolean
          description: Indicates whether the information is forbidden from being used for
            sales prospecting purposes.
          example: false
      description: Instructions regarding the SIREN
    LegalUnitPayloadIncluded:
      type: object
      properties:
        siren:
          maxLength: 9
          minLength: 0
          pattern: ^([0-9]{9})$
          type: string
          description: SIREN number
          example: "702042755"
        businessName:
          maxLength: 150
          type: string
          description: Business name
          example: Boulangerie Pascale
        entityType:
          maxLength: 20
          type: string
          description: Business structure type
          example: Public
          enum:
            - Public
            - PrivateVatRegistered
        administrativeStatus:
          maxLength: 1
          type: string
          description: Refers to the administrative status of the legal unit (Active;
            Closed).
          example: A
          enum:
            - A
            - C
    SearchSiren_filters_siren:
      type: object
      properties:
        op:
          title: opStrict
          type: string
          description: '"strict" comparison operator'
          example: strict
          enum:
            - strict
