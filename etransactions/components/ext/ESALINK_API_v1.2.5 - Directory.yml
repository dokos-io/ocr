info:
  title: HUBTIMIZE PA (Directory) OpenAPI definition
  version: v1.2.5
  description: >

    _Par Esalink (Plateforme Agréée)_
    

    HUBTIMIZE APIs are based on `AFNOR XP Z12-013 version 1.2.0 (02/2026)` definition of standard API
       
    In order to avoid any firewall block, please add to you requests header the following value :
    
     > For __TEST__ environment
     >>- Key = `hubtimize-api-key`
     >>- Value = `a3e49892-260f-4a3f-b497-3c9b68ee85d1`
     
     > For __PROD__ environment
     >>- Key = `hubtimize-api-key`
     >>- Value = `019ac4c7-4142-7156-990b-874404480a96`
    

    ---
    
    ## Changelog
    
    >- `v1.2.5` March 2026 (05/03/2026)
     >>>- __Add__ `/v1/oauth2/token` => standard oauth2 token api

    >- `v1.2.4` March 2026 (05/03/2026)
     >>>- __Upatde on all path__ `/v1/directory` => `/v1` to match AFNOR specification
     >>>- __Removed__ `instanceId` on all methods
     >>>- __Removed__ all GET method with instance ID
     >>>>- `GET /v1/directory/siren/id-instance:{id-instance}`
     >>>>- `GET /v1/directory/siret/id-instance:{id-instance}`
     >>>>- `GET /v1/directory/routing-code/id-instance:{id-instance}`
     >>>>- `GET /v1/directory/directory-line/id-instance:{id-instance}`
     >>>- __Removed__ update directory existing methods
     >>>>- `POST /v1/directory/directory-line`
     >>>>- `PATCH /v1/directory/directory-line/id-instance:{id-instance}`
     >>>>- `DELETE /v1/directory/directory-line/id-instance:{id-instance}`
          
     >- `v1.2.3` November 2025 (27/11/2025)
     >>>- remove parameter `history` on `/directory/siren/id` return
     >>>- change `/v1/directory/directory-line/id-instance:{id-instance}` from `PUT` to `PATCH` to match AFNOR specifications
     >- `v1.2.2` November 2025 (20/11/2025)
     >>>- re-add ignore criteria on `/v1/directory/siren/search`
     >>>- re-add ignore criteria on `/v1/directory/siret/search`
     >>>- re-add ignore criteria on `/v1/directory/routing-code/search`
     >>>- re-add ignore criteria on `/v1/directory/directory-line/search`
     >- `v1.2.1` November 2025 (17/11/2025)
     >>>- removed  `observationDate` on API search, it's forced to the request date
     >>>- removed  `dateTo`, `effectiveEndDate` and `dateFrom` on directory-line returns (return only active entry at request date - _Décret n° 2022-1299 Art. 242 nonies H_)
     >- `v1.2.0` November 2025 (07/11/2025)
     >>- Directory line request for changes (request to Esalink, all requests are validated, no direct change on online directory)
     >>>- `POST /v1/directory/directory-line`: Request a new directoty line creation
     >>>- `PUT /v1/directory/directory-line/id-instance:{id-instance}` : Request a change on a directory line
     >>>- `DELETE /v1/directory/directory-line/id-instance:{id-instance}` : Request the hidding of a non-active (future) directory line
     >>- Other changes
     >>>- add `instanceId` on API search returns
     
     >- `v1.1.1` August 2025
     >>- Adding "hubtimize-api-key" to the headers
     
     >- `v1.1.0` July 2025
     >>- Directory Api (Read)
     >>- Change of url
          
    ---

    ## DIRECTORY Api

    The __Directory Service__ API allows you to:

     >- View and search for companies (SIREN)
     >- View and search for establishments (SIRET)
     >- View and search for routing codes
     >- View and search for directory entries

    View and search for companies (SIREN)

     >- `POST /v1/directory/siren/search` => Search for companies (legal unit)
    meeting all the criteria passed as parameters, potentially multiple results
    returned.
     >- `GET /v1/directory/siren/code-insee:{siren}` => Consult a siren (legal unit)
    identified by a siren passed as a parameter.

    View and search for establishments (SIRET)

     >- `POST /v1/directory/siret/search` =>  Search for establishments meeting all
    of the criteria passed as parameters, potentially returning multiple
    results.
     >- `GET /v1/directory/siret/code-insee:{siret}` => Get a SIRET (facility)
    identified by SIRET.

     View and search for routing codes

     >- `POST /v1/directory/routing-code/search` => Search for routing codes that
    meet all the criteria passed as parameters, potentially returning multiple
    results.
     >- `GET /v1/directory/routing-code/siret:{siret}/code:{routing-identifier}` =>
    Consult the routing code identified by the SIRET and a routing identifier.

     View and search for directory lines

     The directory line is the location at which the recipient wishes to receive his invoices (SIREN or SIREN/SIRET or SIREN/SIRET/routingIdentifier or SIREN/SUFFIX). 

     >- `POST /v1/directory/directory-line/search` => Search for directory lines
    that meet all the criteria passed as parameters, potentially returning
    multiple results.
     >- `GET /v1/directory/directory-line/code:{addressing-identifier}` => Get a
    line in the directory identified by an address identifier.

