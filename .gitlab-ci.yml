include:
  - project: "dokos/docli"
    ref: develop
    file: "/.gitlab-ci.base.yml"

stages:
  - Semgrep
  - Test

variables:
  DOCLI_IMAGE: "registry.gitlab.com/dokos/docli:ci-next"

tests:
  image: $DOCLI_IMAGE
  stage: Test

  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $CI_COMMIT_TAG != null
      allow_failure: true  # Prevent flaky tests from breaking releases
    - when: always

  services:
    - name: mariadb:10.8
      command: ['mariadbd', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--character-set-client-handshake=FALSE', '--innodb_read_only_compressed=OFF']
    - name: redis
      alias: redis_queue
    - name: redis
      alias: redis_cache
    - name: redis
      alias: redis_socketio
    # Mock PA server for the Microcks-backed integration tests (tests/integration).
    - name: quay.io/microcks/microcks-uber:latest
      alias: microcks

  variables:
    MYSQL_DATABASE: "test_dodock"
    MYSQL_ROOT_PASSWORD: "test_dodock"

  before_script:
    - set -e
    - export APPS_BRANCH="$(/ci-utils/get-branch.sh)"
    - bench init . --ignore-exist --no-backups --skip-redis-config-generation --skip-assets --frappe-branch ${FRAPPE_BRANCH:-$APPS_BRANCH}
    - bench get-app https://gitlab.com/dokos/payments.git --branch ${PAYMENTS_BRANCH:-$APPS_BRANCH}
    - bench get-app https://gitlab.com/dokos/dokos.git --branch ${DOKOS_BRANCH:-$APPS_BRANCH}
    - bench get-app /builds/dokos/etransactions/
    - /ci-utils/setup-redis.sh v1
    - /ci-utils/patch-procfile.sh v1
    - cp -r apps/frappe/test_sites/test_site sites/
    - bench setup requirements --dev
    - env/bin/python -m pip install --quiet coverage
    - bench start &> bench_start.log &
    - bench build --app erpnext &
    - build_pid=$!
    - bench --site test_site reinstall --yes --mariadb-root-password test_dodock
    - bench --site test_site install-app payments
    - bench --site test_site install-app erpnext
    - bench --site test_site install-app etransactions
    - wait $build_pid
    # Wait for Microcks, seed the PA API mocks, and point the site at it so the
    # tests/integration suite runs (it skips cleanly when microcks_url is unset).
    - until curl -sf http://microcks:8080/api/keycloak/config >/dev/null 2>&1; do sleep 2; done
    - for spec in apps/etransactions/etransactions/components/mocks/*.yaml; do curl -s -X POST http://microcks:8080/api/artifact/upload -F "file=@$spec" -F "mainArtifact=true"; echo; done
    - bench --site test_site set-config microcks_url http://microcks:8080

  script:
    - bench --site test_site run-parallel-tests --app etransactions --with-coverage

  after_script:
    # Frappe writes one `.coverage.<host>.<pid>` data file per parallel worker into
    # sites/. Recombine them from the app root so the omit list in pyproject.toml
    # applies and test files stop counting as covered source. `--keep` preserves the
    # raw data so frappe's own report stays available for the fallback below.
    - cd $CI_PROJECT_DIR/apps/etransactions
    - $CI_PROJECT_DIR/env/bin/python -m coverage combine --keep $CI_PROJECT_DIR/sites || true
    - $CI_PROJECT_DIR/env/bin/python -m coverage xml -o $CI_PROJECT_DIR/coverage.xml || true
    - cd $CI_PROJECT_DIR
    - test -s coverage.xml || mv sites/coverage.xml coverage.xml || true
    # Cobertura paths are relative to <source>; point it at the repo root so GitLab
    # can map them onto the files in the merge request diff.
    - sed -i "s#<source>[^<]*</source>#<source>${COBERTURA_SOURCE_PATH:-$CI_PROJECT_DIR}</source>#g" coverage.xml || true
    # Always two decimals: a round rate would print as "50% coverage" and slip
    # past the regex below, silently dropping the figure from the job.
    - (cat coverage.xml | awk 'NR==2' | sed 's/.*line-rate="\([^"]*\)".*/\1/' | awk '{ printf "%.2f%% coverage\n", $1 * 100 }') || true

  coverage: '/^\d+\.\d+% coverage/'

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


semgrep:
  stage: Semgrep
  image: semgrep/semgrep
  allow_failure: true
  before_script:
    - git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
  script: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  rules:
  - if: $CI_MERGE_REQUEST_IID
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH