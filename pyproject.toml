[project]
name = "etransactions"
authors = [
    { name = "Dokos SAS", email = "hello@dokos.io"}
]
description = "eTransactions application for Dokos"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "mistralai>=2.10,<3",
    "boto3~=1.34.143",
    "factur-x~=3.1",
    "drafthorse~=2025.1.0",
    "saxonche>=12.5.0,<13.0.0",
    "lxml==6.0.2",
    # v0.16 — https://pypi.org/project/pyfrctc/. 0.12 switched generate_cdar()'s
    # date fields (MDT-8/78/95/100/219) from pre-formatted strings to raw
    # date/datetime objects — see cdar.py's build_cdar_data(). Bump
    # deliberately and re-run test_cdar.py.
    "pyfrctc==0.16",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
Faker = "~=26.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

# Only read when coverage runs from this directory (the CI report regeneration
# step and local use). The in-process run driven by `run-parallel-tests
# --with-coverage` executes from sites/ and passes source/omit/include
# explicitly, so it is unaffected by this section.
[tool.coverage.run]
source = ["."]
parallel = true

[tool.coverage.report]
# Frappe's built-in list only omits `test_*/` directories, which misses our
# `etransactions/tests/` package and the per-doctype `test_*.py` files.
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/patches/*",
    "*/frontend/*",
    "*/node_modules/*",
    "*/doctype/*/*_dashboard.py",
]
