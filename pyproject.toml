[project]
name = "etransactions"
authors = [
    { name = "Dokos SAS", email = "hello@dokos.io"}
]
description = "eTransactions application for Dokos"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "mistralai==1.8.2",
    "boto3~=1.34.143",
    "factur-x~=3.1",
    "drafthorse~=2025.1.0",
    "saxonche>=12.5.0,<13.0.0",
    "lxml==6.0.2",
    # v0.10 — pinned by commit (no 0.10 tag upstream); 0.9 changed CDAR parse
    # return shapes, so bump deliberately and re-run test_cdar.py.
    "pyfrctc @ git+https://github.com/akretion/pyfrctc.git@17f8ff17d2975adc60bca937cb64fb1f539ab97a",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
Faker = "~=26.0.0"
