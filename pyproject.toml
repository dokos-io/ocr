    { name = "Dokos SAS", email = "hello@dokos.io"}
]
description = "OCR application for Dokos"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
